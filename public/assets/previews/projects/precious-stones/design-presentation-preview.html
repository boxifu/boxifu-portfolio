<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Precious Stones Design Presentation Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8f3;
        color: #192024;
      }

      body {
        margin: 0;
        padding: 0.85rem;
      }

      .deck {
        display: grid;
        gap: 0.85rem;
      }

      .slide {
        background: #fff;
        border: 1px solid #d8ded4;
        border-radius: 8px;
        margin: 0;
        overflow: hidden;
      }

      img {
        display: block;
        width: 100%;
      }

      figcaption {
        color: #53615b;
        font-size: 0.82rem;
        padding: 0.55rem 0.7rem 0.7rem;
      }
    </style>
  </head>
  <body>
    <main class="deck" aria-label="Precious Stones design presentation slides">
      <figure class="slide">
        <img src="design-presentation-slides/Slide1.PNG" alt="Slide1">
        <figcaption>Slide1</figcaption>
      </figure>
      <figure class="slide">
        <img src="design-presentation-slides/Slide10.PNG" alt="Slide10">
        <figcaption>Slide10</figcaption>

        <figcaption>Slide2</figcaption>
      </figure>
      <figure class="slide">
        <img src="design-presentation-slides/Slide3.PNG" alt="Slide3">

</html>
